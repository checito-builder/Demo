name: Deploy preview to GitHub Pages

# Publishes the static dOS prototype to GitHub Pages so it has a live,
# shareable URL. Deploys from the default branch and from main, and can be
# run on demand.
#
# One-time setup required: repo Settings -> Pages -> Build and deployment ->
# Source: "GitHub Actions". The Actions token cannot enable Pages itself, so
# until that switch is on the "Configure Pages" step will fail. Once it's on,
# this workflow deploys with no further changes.
on:
  push:
    branches:
      - claude/confident-ramanujan-lg6bnq
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes supersede in-flight ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
